name: 构建 iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_ipa:
        description: "使用 Apple 证书签名并导出 IPA"
        required: true
        default: false
        type: boolean

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 构建未签名 iOS 应用
        if: ${{ github.event_name == 'push' || !inputs.signed_ipa }}
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 IPA
        if: ${{ github.event_name == 'push' || !inputs.signed_ipa }}
        run: |
          mkdir -p build/ios/unsigned/Payload
          mkdir -p build/ios/ipa
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          ditto -c -k --sequesterRsrc --keepParent Payload ../ipa/naiva-drink-unsigned.ipa

      - name: 上传未签名 IPA
        if: ${{ github.event_name == 'push' || !inputs.signed_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: 奶娃喝水-iOS-未签名-IPA
          path: build/ios/ipa/naiva-drink-unsigned.ipa
          if-no-files-found: error

      - name: 导入签名证书
        if: ${{ inputs.signed_ipa }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: 构建已签名 IPA
        if: ${{ inputs.signed_ipa }}
        run: flutter build ipa --release --export-method ad-hoc

      - name: 上传已签名 IPA
        if: ${{ inputs.signed_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: 奶娃喝水-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
